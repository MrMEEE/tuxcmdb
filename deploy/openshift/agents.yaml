apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: tuxcmdb-agents
  annotations:
    description: Optional agent package builders and WebUI build with embedded downloads. Apply after server.yaml.
parameters:
  - name: SOURCE_REPOSITORY_URL
    value: https://github.com/MrMEEE/tuxcmdb.git
    required: true
  - name: SOURCE_REPOSITORY_REF
    value: main
    required: true
  - name: PYTHON_IMAGE
    value: registry.access.redhat.com/ubi10/python-312-minimal:latest
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: tuxcmdb-agents
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: tuxcmdb-agents
    spec:
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: ${SOURCE_REPOSITORY_URL}
          ref: ${SOURCE_REPOSITORY_REF}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: deploy/openshift/agents/Dockerfile
      output:
        to:
          kind: ImageStreamTag
          name: tuxcmdb-agents:latest
      triggers:
        - type: ConfigChange
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: tuxcmdb-webui
    spec:
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: ${SOURCE_REPOSITORY_URL}
          ref: ${SOURCE_REPOSITORY_REF}
        images:
          - from:
              kind: ImageStreamTag
              name: tuxcmdb-agents:latest
            paths:
              - sourcePath: /opt/tuxcmdb-webui-agents/.
                destinationDir: agent-artifacts
      strategy:
        type: Source
        sourceStrategy:
          from:
            kind: DockerImage
            name: ${PYTHON_IMAGE}
          env:
            - name: TUXCMDB_COMPONENT
              value: webui
            - name: TUXCMDB_INCLUDE_AGENTS
              value: "true"
            - name: DISABLE_COLLECTSTATIC
              value: "1"
      output:
        to:
          kind: ImageStreamTag
          name: tuxcmdb-webui:latest
      triggers:
        - type: ImageChange
          imageChange:
            from:
              kind: ImageStreamTag
              name: tuxcmdb-agents:latest
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
