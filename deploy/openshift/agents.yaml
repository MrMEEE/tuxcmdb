apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: tuxcmdb-agents
  annotations:
    description: Optional agent package build, shared RWX storage and independent updater pod.
parameters:
  - name: SOURCE_REPOSITORY_URL
    value: https://github.com/MrMEEE/tuxcmdb.git
    required: true
  - name: SOURCE_REPOSITORY_REF
    value: main
    required: true
  - name: AGENTS_STORAGE_CLASS
    description: StorageClass supporting ReadWriteMany
    required: true
  - name: AGENTS_VOLUME_SIZE
    value: 5Gi
    required: true
objects:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: tuxcmdb-agents
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: tuxcmdb-agents
    spec:
      runPolicy: Serial
      source:
        type: Git
        git:
          uri: ${SOURCE_REPOSITORY_URL}
          ref: ${SOURCE_REPOSITORY_REF}
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: deploy/openshift/agents/Dockerfile
          buildArgs:
            - name: SOURCE_REPOSITORY_URL
              value: ${SOURCE_REPOSITORY_URL}
      output:
        to:
          kind: ImageStreamTag
          name: tuxcmdb-agents:latest
      triggers:
        - type: ConfigChange
      resources:
        requests: {cpu: 100m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: tuxcmdb-agents
    spec:
      accessModes: [ReadWriteMany]
      storageClassName: ${AGENTS_STORAGE_CLASS}
      resources:
        requests:
          storage: ${AGENTS_VOLUME_SIZE}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: tuxcmdb-agents-updater
      annotations:
        image.openshift.io/triggers: >-
          [{"from":{"kind":"ImageStreamTag","name":"tuxcmdb-agents:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"updater\")].image"}]
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels: {app: tuxcmdb, component: agents-updater}
      template:
        metadata:
          labels: {app: tuxcmdb, component: agents-updater}
          annotations:
            alpha.image.policy.openshift.io/resolve-names: "*"
        spec:
          automountServiceAccountToken: false
          containers:
            - name: updater
              image: tuxcmdb-agents:latest
              imagePullPolicy: Always
              command: ["/bin/bash", "/usr/local/bin/run-updater"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                runAsNonRoot: true
                seccompProfile: {type: RuntimeDefault}
              volumeMounts:
                - name: agent-downloads
                  mountPath: /var/lib/tuxcmdb-agents
              readinessProbe:
                exec:
                  command:
                    - /bin/bash
                    - -ec
                    - test -f /tmp/agents-published && test -d /var/lib/tuxcmdb-agents/current
                periodSeconds: 10
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 500m, memory: 256Mi}
          volumes:
            - name: agent-downloads
              persistentVolumeClaim:
                claimName: tuxcmdb-agents
