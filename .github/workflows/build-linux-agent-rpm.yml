name: Build Linux Agent Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - el: 8
            container: registry.access.redhat.com/ubi8/ubi:latest
          - el: 9
            container: registry.access.redhat.com/ubi9/ubi:latest
          - el: 10
            container: registry.access.redhat.com/ubi10/ubi:latest

    container:
      image: ${{ matrix.container }}
      options: --user 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fpm
        run: |
          set -euo pipefail
          # ubi10 base images ship a newer rpm-libs/rpm-plugin-syslog than the repo's rpm-build
          # depends on; --allowerasing lets dnf reconcile that version mismatch.
          dnf install -y --allowerasing git ca-certificates python3 python3-pip ruby ruby-devel rpm-build findutils
          if [[ "${{ matrix.el }}" == "8" ]]; then
            dnf install -y python3-requests
          fi
          gem install --no-document fpm -v 1.15.1

      - name: Prepare build root
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/build-agent-package.sh "el${{ matrix.el }}" "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxcmdb-agent-rpm-el${{ matrix.el }}
          path: dist/el${{ matrix.el }}/*.rpm

      - name: Attach RPM to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/el${{ matrix.el }}/*.rpm

  build-linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates ruby ruby-dev
          sudo gem install --no-document fpm -v 1.15.1

      - name: Prepare build root
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/build-agent-package.sh debian "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxcmdb-agent-deb
          path: dist/debian/*.deb

      - name: Attach DEB to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/debian/*.deb

  build-webui-agents-package:
    needs: [build-linux-packages, build-linux-deb]
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi10/ubi:latest
      options: --user 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # ubi10 base images ship a newer rpm-libs/rpm-plugin-syslog than the repo's rpm-build
          # depends on; --allowerasing lets dnf reconcile that version mismatch.
          dnf install -y --allowerasing git ca-certificates ruby ruby-devel rpm-build findutils
          gem install --no-document fpm -v 1.15.1

      - name: Download agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tuxcmdb-agent-*
          path: agent-artifacts

      - name: Build tuxcmdb-webui-agents package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_DIR="dist/webui-agents"

          rm -rf buildroot "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          mkdir -p buildroot/opt/tuxcmdb-webui-agents

          find agent-artifacts -type f \( -name '*.rpm' -o -name '*.deb' \) -exec cp {} buildroot/opt/tuxcmdb-webui-agents/ \;
          cp agent/windows/tuxcmdb-agent.ps1 buildroot/opt/tuxcmdb-webui-agents/tuxcmdb-agent.ps1
          cp agent/windows/tuxcmdb-agent.ps1 "buildroot/opt/tuxcmdb-webui-agents/tuxcmdb-agent-${VERSION}.ps1"
          chmod 0644 buildroot/opt/tuxcmdb-webui-agents/*

          fpm -s dir -t rpm \
            -n tuxcmdb-webui-agents \
            -v "$VERSION" \
            --iteration "1" \
            --architecture noarch \
            -C buildroot .

          mv ./*.rpm "$DIST_DIR"/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxcmdb-webui-agents
          path: dist/webui-agents/*

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/webui-agents/*
